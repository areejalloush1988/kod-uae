<script id="tawfeer-language">// Read only the app's own copy catalog. Customer names, notes and orders never enter a translation service.
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('tawfeer-language-data').textContent);
  const supported = ['ar','en','ur','fa'];
  const address = new URL(location.href);
  const requested = address.searchParams.get('lang');
  let remembered;
  try { remembered = localStorage.getItem('tawfeer-language-v1'); } catch {}
  const valid = value => supported.includes(value);
  const code = valid(requested) ? requested : valid(remembered) ? remembered : 'ar';
  function remember(value) {
    try { localStorage.setItem('tawfeer-language-v1',value); } catch {}
  }
  if (valid(requested)) remember(code);
  document.documentElement.lang = code;
  document.documentElement.dir = code === 'en' ? 'ltr' : 'rtl';
  const table = data[code] || {};
  const text = source => typeof source === 'string' && Object.hasOwn(table,source) ? table[source] : source;
  function localText(value) {
    const source = value.trim();
    return source && text(source) !== source ? value.replace(source, () => text(source)) : value;
  }
  function withLanguage(link) {
    const url = new URL(link,location.href);
    if (url.origin === location.origin && (code !== 'ar' || valid(requested))) url.searchParams.set('lang',code);
    return url.href;
  }
  function applyStatic(root) {
    const nodes = root.createTreeWalker(root.documentElement,NodeFilter.SHOW_TEXT);
    for (let n=nodes.nextNode(); n; n=nodes.nextNode()) {
      if (!n.parentElement || n.parentElement.closest('script,style,svg,textarea,[data-language-picker]')) continue;
      const contextual = n.parentElement.getAttribute('data-copy-source');
      const value = contextual && code!=='ar' ? n.nodeValue.replace(n.nodeValue.trim(),()=>text(contextual)) : localText(n.nodeValue);
      if (value !== n.nodeValue) n.nodeValue = value;
    }
    for (const el of root.querySelectorAll('[aria-label],[alt],[title],[placeholder],meta[content]')) {
      for (const attr of ['aria-label','alt','title','placeholder','content']) {
        if (el.hasAttribute(attr)) {
          const source = el.getAttribute(attr), value = localText(source);
          if (value !== source) el.setAttribute(attr,value);
        }
      }
    }
    for (const picker of root.querySelectorAll('[data-language-picker]')) picker.value = code;
    if (root.body.hasAttribute('data-language-links')) {
      for (const link of root.querySelectorAll('a[href]')) {
        if (!link.getAttribute('href').startsWith('.')) continue;

    else if(v.typeMismatch) source = field.type==='email' ? 'أدخل عنوان بريد إلكتروني صحيحاً.' : 'أدخل رابطاً صحيحاً.';
    else if(v.badInput) source='أدخل رقماً صحيحاً لهذا الحقل.';
    else if(v.patternMismatch) source='أدخل القيمة بالصيغة المطلوبة.';
    else if(v.rangeUnderflow) source='يجب ألا تقلّ القيمة عن {min}.';
    else if(v.rangeOverflow) source='يجب ألا تتجاوز القيمة {max}.';
    else if(v.tooShort) source='أدخل {min} أحرف على الأقل.';
    else if(v.tooLong) source='لا تدخل أكثر من {max} حرفاً.';
    else if(v.stepMismatch) source='اختر قيمة تتوافق مع مقدار الزيادة المسموح به.';
